<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Kostenlos registrieren | Leistung-Finder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #0d3934;
      --primary-dark: #082621;
      --accent: #ad7f42;
      --accent-dark: #8a6533;
      --bg: #f5f2ea;
      --text: #1b201e;
      --muted: #5c655f;
      --border: #e2ded2;
      --error: #a3372f;
      --green-soft: #e3efe9;
      --gold-soft: #f3e7d0;
      --shadow: 0 2px 4px rgba(8,38,33,.08), 0 18px 44px rgba(0,0,0,.28);
      --serif: "Fraunces", Georgia, serif;
      --sans: "Work Sans", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--sans);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 85% 8%, rgba(28,92,83,.75), transparent 45%),
        radial-gradient(circle at 10% 95%, rgba(173,127,66,.22), transparent 40%),
        linear-gradient(160deg, var(--primary) 0%, var(--primary-dark) 100%);
      background-attachment: fixed;
    }
    .card {
      position: relative;
      background: #fff;
      border: 1px solid var(--border);
      border-top: 4px solid var(--accent);
      border-radius: 28px;
      padding: 2.2rem 1.9rem 2rem;
      max-width: 420px;
      width: 100%;
      box-shadow: var(--shadow);
      animation: lfUp .5s ease both;
    }
    @keyframes lfUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .logotype {
      display: flex;
      align-items: center;
      gap: .6rem;
      font-family: var(--serif);
      font-weight: 600;
      font-size: 1.2rem;
      color: var(--primary);
      margin-bottom: 1.5rem;
    }
    .logotype::before {
      content: "";
      width: 34px; height: 34px;
      border-radius: 10px;
      background: var(--accent) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='6'/><path d='M20 20l-4-4'/></svg>") center / 60% no-repeat;
    }
    h1 {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 1.7rem;
      margin: 0 0 .4rem;
      color: var(--primary);
    }
    p.lede {
      color: var(--muted);
      font-size: .95rem;
      margin: 0 0 1.5rem;
    }
    label {
      display: block;
      font-size: .85rem;
      font-weight: 600;
      margin-bottom: .35rem;
      color: var(--text);
    }
    input {
      width: 100%;
      padding: .8rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      font-size: 1rem;
      font-family: var(--sans);
      margin-bottom: 1.1rem;
      background: #fcfbf8;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    input:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(13,57,52,.12);
    }
    button {
      width: 100%;
      padding: .9rem;
      background: linear-gradient(135deg, var(--primary) 0%, #14524a 100%);
      color: #fff;
      border: none;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      font-family: var(--sans);
      box-shadow: 0 8px 20px rgba(8,38,33,.35);
      transition: transform .2s, box-shadow .2s;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(8,38,33,.42); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: .6; cursor: default; transform: none; }
    .msg {
      margin-top: 1rem;
      font-size: .88rem;
      padding: .75rem 1rem;
      border-radius: 14px;
      display: none;
    }
    .msg.error { background: #fdecea; color: var(--error); display: block; }
    .msg.success { background: var(--green-soft); color: #1b5e3a; display: block; }
    .switch {
      margin-top: 1.4rem;
      font-size: .9rem;
      color: var(--muted);
      text-align: center;
    }
    .switch a { color: var(--accent-dark); font-weight: 700; text-decoration: none; }
    .switch a:hover { text-decoration: underline; text-underline-offset: 3px; }
    button:focus-visible, .switch a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logotype">Leistung-Finder</div>
    <h1>Kostenlos registrieren</h1>
    <p class="lede">Leg dir dein Konto an, um deine Anträge und Ergebnisse zu speichern.</p>

    <form id="signupForm">
      <label for="email">E-Mail-Adresse</label>
      <input type="email" id="email" required autocomplete="email" />

      <label for="password">Passwort (mind. 6 Zeichen)</label>
      <input type="password" id="password" required minlength="6" autocomplete="new-password" />

      <button type="submit" id="submitBtn">Registrieren</button>
    </form>

    <div class="msg" id="msgBox"></div>

    <div class="switch">
      Schon registriert? <a href="/mitglieder/login.html">Hier einloggen</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://rnnmdlibekqhqrxqqrws.supabase.co";
    const SUPABASE_KEY = "sb_publishable_PXFh4qggQUq3Eb4AGbPpPg_05HIlS1x";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById("signupForm");
    const msgBox = document.getElementById("msgBox");
    const submitBtn = document.getElementById("submitBtn");

    function showMsg(text, type) {
      msgBox.textContent = text;
      msgBox.className = "msg " + type;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = "Bitte warten...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { data, error } = await client.auth.signUp({ email, password });

      submitBtn.disabled = false;
      submitBtn.textContent = "Registrieren";

      if (error) {
        showMsg("Fehler: " + error.message, "error");
        return;
      }

      showMsg("Fast fertig! Bitte prüf dein E-Mail-Postfach und bestätige deine Adresse, bevor du dich einloggst.", "success");
      form.reset();
    });
  </script>

</body>
</html>

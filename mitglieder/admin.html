<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Admin – Aktionen &amp; Banner verwalten | Leistung-Finder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #0f4c46;
      --primary-dark: #0a3733;
      --accent: #e0982e;
      --bg: #faf7f2;
      --text: #1e2624;
      --muted: #5c6b67;
      --border: #dfe3df;
      --error: #b3261e;
      --serif: "Fraunces", Georgia, serif;
      --sans: "Work Sans", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
    }

    .hero {
      background: var(--primary);
      color: #fff;
      padding: 1.5rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logotype {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 1.1rem;
    }

    .hero a {
      color: #fff;
      font-size: 0.82rem;
      opacity: 0.85;
      text-decoration: none;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 1.75rem 1.1rem 3rem;
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      background: none;
      border: none;
      padding: 0.6rem 0.2rem;
      margin: 0 0.75rem 0 0;
      font-family: var(--sans);
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .tab-btn.active {
      color: var(--primary-dark);
      border-bottom-color: var(--accent);
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    h1 {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 1.4rem;
      color: var(--primary-dark);
      margin: 0 0 1.25rem;
    }

    h2 {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 1.1rem;
      color: var(--primary-dark);
      margin: 2rem 0 0.75rem;
    }

    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      margin: 0.7rem 0 0.3rem;
    }

    label:first-child {
      margin-top: 0;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.9rem;
      font-family: var(--sans);
    }

    textarea {
      min-height: 180px;
      resize: vertical;
      line-height: 1.45;
    }

    button {
      margin-top: 1rem;
      padding: 0.65rem 1.2rem;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: var(--sans);
    }

    button:hover {
      background: var(--primary-dark);
    }

    .msg {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      padding: 0.6rem 0.8rem;
      border-radius: 4px;
      display: none;
    }

    .msg.error {
      background: #fdecea;
      color: var(--error);
      display: block;
    }

    .msg.success {
      background: #e8f5e9;
      color: #1b5e20;
      display: block;
    }

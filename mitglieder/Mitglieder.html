
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Mein Leistung-Finder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #0f4c46;
      --primary-dark: #0a3733;
      --accent: #e0982e;
      --bg: #faf7f2;
      --text: #1e2624;
      --muted: #5c6b67;
      --border: #dfe3df;
      --serif: "Fraunces", Georgia, serif;
      --sans: "Work Sans", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
    }
    .hero {
      background: var(--primary);
      color: #fff;
      padding: 1.75rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logotype {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 1.15rem;
    }
    #logoutBtn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.4);
      color: #fff;
      padding: 0.45rem 0.9rem;
      border-radius: 4px;
      font-family: var(--sans);
      font-size: 0.85rem;
      cursor: pointer;
    }
    #logoutBtn:hover { background: rgba(255,255,255,0.25); }
    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 2rem 1.25rem;
    }
    h1 {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 1.6rem;
      color: var(--primary-dark);
      margin: 0 0 0.5rem;
    }
    p.lede {
      color: var(--muted);
      margin: 0 0 1.5rem;
    }
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }
    #loading {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }
    #content { display: none; }
  </style>
</head>
<body>

  <div id="loading">Wird geladen...</div>

  <div id="content">
    <div class="hero">
      <div class="logotype">Leistung-Finder</div>
      <button id="logoutBtn">Ausloggen</button>
    </div>

    <div class="container">
      <h1>Willkommen zurück!</h1>
      <p class="lede" id="userEmail"></p>

      <div class="card">
        <p>Hier entsteht bald dein persönlicher Bereich mit deinen gespeicherten Anträgen und Ergebnissen.</p>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://rnnmdlibekqhqrxqqrws.supabase.co";
    const SUPABASE_KEY = "sb_publishable_PXFh4qggQUq3Eb4AGbPpPg_05HIlS1x";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function checkSession() {
      const { data } = await client.auth.getSession();

      if (!data.session) {
        window.location.href = "/mitglieder/login.html";
        return;
      }

      document.getElementById("userEmail").textContent =
        "Eingeloggt als: " + data.session.user.email;
      document.getElementById("loading").style.display = "none";
      document.getElementById("content").style.display = "block";
    }

    checkSession();

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await client.auth.signOut();
      window.location.href = "/mitglieder/login.html";
    });
  </script>

</body>
</html>

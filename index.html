<html lang="de">
<head>
  <meta charset="UTF-8" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Leistung-Finder",
    "url": "https://leistung-finder.de/",
    "description": "Kostenloser Leistung-Finder: In wenigen Schritten passende Unterstützungsleistungen finden und unverbindlich an Partner vermitteln lassen.",
    "inLanguage": "de-DE",
    "publisher": {
      "@type": "Organization",
      "name": "Leistung-Finder",
      "url": "https://leistung-finder.de/",
      "email": "info@leistung-finder.de"
    }
            }

            ${partnerBlocksHtml}

          </div>

        `;

      }).join('');

    }


    /*
      MATCHING
    */

    const matchRules = {

      elterngeld: s => {

        const age =
          s.familyChildAge !== ''
            ? parseFloat(
                String(s.familyChildAge).replace(',', '.')
              )
            : null;

        if (age !== null && age > 3) {

          return {
            relevant: false,
            reason: 'Elterngeld wird grundsätzlich in der frühen Zeit nach der Geburt bezogen. Bei deiner Altersangabe ist ein Anspruch vermutlich nicht mehr gegeben.'
          };

        }

        return {
          relevant: true,
          reason: 'Kann passen, wenn dein Kind noch in der relevanten Bezugszeit ist. Die genaue Anspruchsdauer bitte auf der offiziellen Seite prüfen.'
        };

      },


      kindergeld: s => ({
        relevant: true,
        reason: 'Kann passen, sofern die gesetzlichen Voraussetzungen für Kindergeld erfüllt sind.'
      }),


      unterhaltsvorschuss: s => {

        if (s.familyStatus === 'partner') {

          return {
            relevant: false,
            reason: 'Unterhaltsvorschuss ist grundsätzlich für Alleinerziehende vorgesehen.'
          };

        }

        return {
          relevant: true,
          reason: 'Kann passen, wenn du alleinerziehend bist und der andere Elternteil keinen oder zu wenig Unterhalt zahlt.'
        };

      },


      kinderzuschlag: s => {

        if (
          s.familyIncome === 'mittel' ||
          s.familyIncome === 'hoch'
        ) {

          return {
            relevant: false,
            reason: 'Kinderzuschlag richtet sich insbesondere an Familien mit Einkommen, das für die Eltern reicht, aber für den vollständigen Bedarf der Kinder nicht ausreicht.'
          };

        }

        return {
          relevant: true,
          reason: 'Kann passen, wenn dein Einkommen für dich reicht, aber der Bedarf deiner Kinder nicht vollständig gedeckt ist.'
        };

      },


      grundsicherungsgeld: s => {

        if (s.employmentStatus === 'rente') {

          return {
            relevant: false,
            reason: 'Grundsicherungsgeld richtet sich an erwerbsfähige Menschen. Für Menschen im Rentenalter oder bei dauerhafter voller Erwerbsminderung kommt eine andere Grundsicherungsleistung in Betracht.'
          };

        }

        return {
          relevant: true,
          reason: 'Kann passen, wenn du erwerbsfähig bist und dein Einkommen beziehungsweise Vermögen nicht für den Lebensunterhalt reicht.'
        };

      },


      wohngeld: s => {

        if (s.familyIncome === 'hoch') {

          return {
            relevant: false,
            reason: 'Wohngeld ist für Haushalte mit geringerem Einkommen vorgesehen.'
          };

        }

        return {
          relevant: true,
          reason: 'Kann passen, wenn dein Einkommen und deine Wohnkosten die gesetzlichen Voraussetzungen erfüllen.'
        };

      },


      'wohngeld-wohnen': s => {

        if (s.familyIncome === 'hoch') {

          return {
            relevant: false,
            reason: 'Wohngeld ist für Haushalte mit geringerem Einkommen vorgesehen.'
          };

        }

        return {
          relevant: true,
          reason: 'Kann passen, wenn dein Einkommen und deine Wohnkosten die gesetzlichen Voraussetzungen erfüllen.'
        };

      },


      'grundsicherung-alter': s => {

        if (
          s.employmentStatus &&
          s.employmentStatus !== 'rente'
        ) {

          return {
            relevant: false,
            reason: 'Diese Leistung richtet sich insbesondere an Menschen im Rentenalter oder mit dauerhafter voller Erwerbsminderung.'
          };

        }

        return {
          relevant: true,
          reason: 'Kann passen, wenn du im Rentenalter bist oder dauerhaft voll erwerbsgemindert bist und dein Einkommen nicht reicht.'
        };

      },


      bildungsgutschein: s => {

        if (s.employmentStatus === 'erwerbstaetig') {

          return {
            relevant: false,
            reason: 'Ein Bildungsgutschein kommt insbesondere bei Arbeitslosigkeit, drohender Arbeitslosigkeit oder anderem beruflichem Weiterbildungsbedarf in Betracht.'
          };

        }

        return {
          relevant: true,
          reason: 'Kann passen, wenn du arbeitslos bist, von Arbeitslosigkeit bedroht bist oder eine geförderte berufliche Weiterbildung benötigst.'
        };

      },


      'aufstiegs-bafoeg': s => {

        if (s.employmentStatus === 'arbeitslos') {

          return {
            relevant: false,
            reason: 'Aufstiegs-BAföG betrifft berufliche Aufstiegsfortbildungen und hängt nicht allein vom Arbeitslosenstatus ab.'
          };

        }

        return {
          relevant: true,
          reason: 'Kann passen, wenn du eine berufliche Aufstiegsfortbildung planst.'
        };

      },


      gruendungszuschuss: s => {

        if (
          s.employmentStatus &&
          s.employmentStatus !== 'arbeitslos'
        ) {

          return {
            relevant: false,
            reason: 'Der Gründungszuschuss setzt unter anderem einen entsprechenden Anspruch auf Arbeitslosengeld und die weiteren gesetzlichen Voraussetzungen voraus.'
          };

        }

        return {
          relevant: true,
          reason: 'Kann passen, wenn du aus der Arbeitslosigkeit heraus eine hauptberufliche Selbstständigkeit aufnehmen möchtest.'
        };

      },


      'stromspar-check': s => {

        if (
          s.familyIncome === 'hoch' ||
          s.familyIncome === 'mittel'
        ) {

          return {
            relevant: false,
            reason: 'Der Stromspar-Check richtet sich insbesondere an Haushalte mit geringem Einkommen.'
          };

        }

        return {
          relevant: true,
          reason: 'Kann passen, wenn dein Haushaltseinkommen eher gering ist.'
        };

      },


      schuldnerberatung: s => {

        if (s.familyIncome === 'hoch') {

          return {
            relevant: false,
            reason: 'Schuldnerberatung ist vor allem bei finanziellen Schwierigkeiten oder Überschuldung relevant.'
          };

        }

        return {
          relevant: true,
          reason: 'Kann passen, wenn du finanzielle Schwierigkeiten oder Schulden hast.'
        };

      },


      exist: s => {

        if (s.bizPhase === 'bestehend') {

          return {
            relevant: false,
            reason: 'EXIST richtet sich insbesondere an bestimmte technologie- und wissensbasierte Gründungsvorhaben.'
          };

        }

        return {
          relevant: true,
          reason: 'Kann passen, wenn du ein technologie- oder wissensbasiertes Gründungsvorhaben mit entsprechendem Hochschul- oder Forschungsbezug planst.'
        };

      },


      'mittelstand-digital': s => {

        if (
          s.bizFocus &&
          s.bizFocus !== 'digitalisierung'
        ) {

          return {
            relevant: false,
            reason: 'Dieses Angebot ist insbesondere auf Digitalisierung ausgerichtet.'
          };

        }

        return {
          relevant: true,
          reason: 'Kann passen, wenn Digitalisierung ein Thema für dein Unternehmen ist.'
        };

      },


      wegebau: s => {

        if (s.bizPhase === 'gruendung') {

          return {
            relevant: false,
            reason: 'Die Förderung der Weiterbildung von Beschäftigten setzt grundsätzlich Beschäftigte voraus.'
          };

        }

        return {
          relevant: true,
          reason: 'Kann passen, wenn du Beschäftigte beruflich weiterbilden möchtest.'
        };

      },


      qualichancengesetz: s => {

        if (s.bizPhase === 'gruendung') {

          return {
            relevant: false,
            reason: 'Die Beschäftigtenförderung setzt grundsätzlich bereits Beschäftigte im Unternehmen voraus.'
          };

        }

        return {
          relevant: true,
          reason: 'Kann passen, wenn du Beschäftigte weiterqualifizieren möchtest.'
        };

      },


      kurzarbeitergeld: s => {

        if (s.bizPhase === 'gruendung') {

          return {
            relevant: false,
            reason: 'Kurzarbeitergeld setzt ein bestehendes Unternehmen und die weiteren gesetzlichen Voraussetzungen für Kurzarbeit voraus.'
          };

        }

        return {
          relevant: true,
          reason: 'Kann passen, wenn dein Unternehmen vorübergehend erheblichen Arbeitsausfall hat.'
        };

      },


      'bafa-energie': s => {

        if (
          s.bizFocus &&
          s.bizFocus !== 'energie'
        ) {

          return {
            relevant: false,
            reason: 'Dieses Angebot betrifft insbesondere Energieberatung und Energieeffizienz.'
          };

        }

        return {
          relevant: true,
          reason: 'Kann passen, wenn Energieeffizienz oder Energieberatung für dein Unternehmen relevant ist.'
        };

      },


      'kfw-energieeffizienz': s => {

        if (
          s.bizFocus &&
          s.bizFocus !== 'energie'
        ) {

          return {
            relevant: false,
            reason: 'Dieses Angebot ist insbesondere auf Energie- und Umweltvorhaben ausgerichtet.'
          };

        }

        return {
          relevant: true,
          reason: 'Kann passen, wenn du in Energieeffizienz oder Umweltmaßnahmen investieren möchtest.'
        };

      },


      buergschaftsbanken: s => {

        if (s.bizSize === 'gross') {

          return {
            relevant: false,
            reason: 'Bürgschaftsbanken unterstützen insbesondere kleine und mittlere Unternehmen; die konkrete Zuständigkeit muss regional geprüft werden.'
          };

        }

        return {
          relevant: true,
          reason: 'Kann passen, wenn für eine Finanzierung nicht genügend eigene Sicherheiten vorhanden sind.'
        };

      }

    };


    function getCategoryMatches(category) {

      let base =
        programs.filter(
          p =>
            p.category === category &&
            p.active
        );


      if (category === 'familie') {

        const kz =
          programs.find(
            p =>
              p.id === 'kinderzuschlag' &&
              p.active
          );

        if (kz) {
          base = base.concat([kz]);
        }

      }


      return base.map(p => {

        const rule =
          matchRules[p.id];

        if (!rule) {

          return {
            program: p,
            relevant: true,
            reason: null
          };

        }

        const result =
          rule(state);

        return {
          program: p,
          relevant: result.relevant,
          reason: result.reason
        };

      });

    }


    function programCardHtml(
      p,
      matchNote,
      relevant
    ) {

      const noteClass =
        relevant === false
          ? 'match-note match-note-low'
          : 'match-note';


      return `

        <li class="result-card">

          <span class="badge">
            ${categoryLabels[p.category] || ''}
          </span>

          ${
            p.affiliate
              ? '<span class="badge badge-ad">Partnerangebot</span>'
              : ''
          }

          <h4>
            ${p.name}
          </h4>

          ${
            matchNote
              ? `
                <p class="${noteClass}">
                  ${matchNote}
                </p>
              `
              : ''
          }

          <p>
            ${p.description}
          </p>

          <dl class="result-meta">

            <div>
              <dt>Möglicherweise passend, wenn:</dt>
              <dd>${p.eligibility}</dd>
            </div>

            <div>
              <dt>Höhe/Umfang:</dt>
              <dd>${p.amount}</dd>
            </div>

            <div>
              <dt>Zuständige Stelle:</dt>
              <dd>${p.authority}</dd>
            </div>

            <div>
              <dt>Region:</dt>
              <dd>${p.region}</dd>
            </div>

            <div>
              <dt>Frist:</dt>
              <dd>${p.deadline}</dd>
            </div>

          </dl>

          <div class="result-links">

            <a
              href="${p.officialUrl}"
              target="_blank"
              rel="${p.affiliate ? 'sponsored noopener' : 'noopener'}"
            >
              ${p.affiliate ? 'Partnerangebot' : 'Offizielle Informationen'}
            </a>

            <a
              href="${p.applicationUrl}"
              target="_blank"
              rel="${p.affiliate ? 'sponsored noopener' : 'noopener'}"
            >
              ${p.affiliate ? 'Zum Partnerangebot' : 'Zum offiziellen Angebot'}
            </a>

          </div>

        </li>

      `;

    }


    function renderResults() {

      const matches =
        getCategoryMatches(state.need);


      if (!matches.length) {

        resultList.innerHTML = `

          <li class="result-card">

            <h4>
              Aktuell keine passende Leistung gefunden
            </h4>

            <p>
              Für deine Auswahl liegt uns noch keine konkrete Leistung vor.
            </p>

            <p class="muted">
              Du kannst stattdessen:
            </p>

            <ul class="result-list-plain">

              <li>
                eine andere Kategorie auswählen
              </li>

              <li>
                deine Situation über das Formular schildern
              </li>

            </ul>

          </li>

        `;

        partnerLink.style.display = 'none';

        return;

      }


      let relevant =
        matches.filter(
          m => m.relevant
        );

      let others =
        matches.filter(
          m => !m.relevant
        );


      if (!relevant.length) {

        relevant = matches;
        others = [];

      }


      let html =
        relevant
          .map(
            m =>
              programCardHtml(
                m.program,
                m.reason,
                m.relevant
              )
          )
          .join('');


      if (others.length) {

        html += `

          <li>

            <details class="other-matches">

              <summary>
                ${others.length}
                weitere Leistung${others.length > 1 ? 'en' : ''}
                in dieser Kategorie anzeigen
              </summary>

              <ul class="result-list-plain-cards">

                ${others
                  .map(
                    m =>
                      programCardHtml(
                        m.program,
                        m.reason,
                        false
                      )
                  )
                  .join('')}

              </ul>

            </details>

          </li>

        `;

      }


      html += `

        <li>

          <span class="badge">
            Hinweis
          </span>

          Dies ist eine erste Orientierung anhand deiner Angaben,
          keine Anspruchsgarantie und keine Rechtsberatung.
          Die verbindliche Prüfung übernimmt die jeweils zuständige Stelle.
          Stand der Angaben: September 2026.

        </li>

      `;


      resultList.innerHTML =
        html;


      partnerLink.style.display =
        '';


      partnerLink.href =
        relevant[0].program.applicationUrl;

    }


    /* ZIELGRUPPE */

    targetButtons.forEach(btn => {

      btn.addEventListener(
        'click',
        () => {

          targetButtons.forEach(
            b =>
              b.classList.remove('active')
          );

          btn.classList.add('active');

          state.target =
            btn.dataset.target;

          state.need = null;

          toStep2Btn.disabled =
            true;

          privateExtraEl.style.display =
            'none';

          businessExtraEl.style.display =
            'none';

          updateNeedsView();

        }
      );

    });


    /* BEDARF */

    function selectNeed(need) {

      state.need =
        need;


      const allOptions =
        Array.from(
          document.querySelectorAll(
            '.option-btn'
          )
        );


      allOptions.forEach(
        b =>
          b.style.borderColor =
            'var(--border)'
      );


      const activeBtn =
        document.querySelector(
          `.option-btn[data-need="${need}"]`
        );


      if (activeBtn) {

        activeBtn.style.borderColor =
          'var(--primary)';

      }


      toStep2Btn.disabled =
        false;


      if (state.target === 'private') {

        privateExtraEl.style.display =
          '';

        businessExtraEl.style.display =
          'none';

        familyChildAgeRowEl.style.display =
          need === 'familie'
            ? ''
            : 'none';

      } else {

        privateExtraEl.style.display =
          'none';

        businessExtraEl.style.display =
          '';

      }

    }


    needsPrivate
      .querySelectorAll('.option-btn')
      .forEach(btn => {

        btn.addEventListener(
          'click',
          () =>
            selectNeed(
              btn.dataset.need
            )
        );

      });


    needsBusiness
      .querySelectorAll('.option-btn')
      .forEach(btn => {

        btn.addEventListener(
          'click',
          () =>
            selectNeed(
              btn.dataset.need
            )
        );

      });


    function collectStep2() {

      state.detailText =
        detailTextEl.value.trim();

      state.familyChildAge =
        familyChildAgeEl.value.trim();

      state.familyStatus =
        familyStatusEl.value;

      state.familyIncome =
        familyIncomeEl.value;

      state.employmentStatus =
        employmentStatusEl.value;

      state.familyBundesland =
        familyBundeslandEl.value;

      state.bizPhase =
        bizPhaseEl.value;

      state.bizSize =
        bizSizeEl.value;

      state.bizFocus =
        bizFocusEl.value;

      state.bizBundesland =
        bizBundeslandEl.value;

      state.region =
        state.target === 'private'
          ? state.familyBundesland
          : state.bizBundesland;

    }


    /* NAVIGATION */

    toStep2Btn.addEventListener(
      'click',
      () => {

        collectStep2();
        showStep(1);

      }
    );


    backToStep1Btn.addEventListener(
      'click',
      () => {

        showStep(0);

      }
    );


    toStep3Btn.addEventListener(
      'click',
      () => {

        collectStep2();
        showStep(2);

      }
    );


    backToStep2Btn.addEventListener(
      'click',
      () => {

        showStep(1);

      }
    );


    /* FORMULAR */

    submitLeadBtn.addEventListener(
      'click',
      () => {

        state.name =
          nameEl.value.trim();

        state.email =
          emailEl.value.trim();

        state.phone =
          phoneEl.value.trim();


        if (
          !state.name ||
          !state.email
        ) {

          alert(
            'Bitte Name und E-Mail ausfüllen.'
          );

          return;

        }


        if (
          !consentPartnerEl.checked ||
          !consentPrivacyEl.checked
        ) {

          alert(
            'Bitte beide Einwilligungen bestätigen.'
          );

          return;

        }


        renderResults();

        showStep(3);

        leadStatus.textContent =
          'Anfrage wird übermittelt …';

        leadStatus.className =
          'lead-status';


        submitLeadBtn.disabled =
          true;


        fetch(
          'https://formspree.io/f/xnpqlyor',
          {
            method: 'POST',

            headers: {
              'Content-Type':
                'application/json',

              'Accept':
                'application/json'
            },

            body:
              JSON.stringify({

                typ:
                  state.target === 'private'
                    ? 'Privatperson'
                    : 'Unternehmen',

                name:
                  state.name,

                email:
                  state.email,

                phone:
                  state.phone,

                region:
                  state.region,

                bedarf:
                  state.need,

                detailText:
                  state.detailText,

    /* NEUE SUCHE */

    restartBtn.addEventListener(
      'click',
      () => {

        state.need = null;
        state.detailText = '';
        state.region = '';
        state.name = '';
        state.email = '';
        state.phone = '';
        state.familyChildAge = '';
        state.familyStatus = '';
        state.familyIncome = '';
        state.employmentStatus = '';
        state.familyBundesland = '';
        state.bizPhase = '';
        state.bizSize = '';
        state.bizFocus = '';
        state.bizBundesland = '';

        detailTextEl.value = '';
        nameEl.value = '';
        emailEl.value = '';
        phoneEl.value = '';

        familyChildAgeEl.value = '';
        familyStatusEl.value = '';
        familyIncomeEl.value = '';
        employmentStatusEl.value = '';
        familyBundeslandEl.value = '';

        bizPhaseEl.value = '';
        bizSizeEl.value = '';
        bizFocusEl.value = '';
        bizBundeslandEl.value = '';

        privateExtraEl.style.display =
          'none';

        businessExtraEl.style.display =
          'none';

        consentPartnerEl.checked =
          false;

        consentPrivacyEl.checked =
          false;

        toStep2Btn.disabled =
          true;

        updateNeedsView();

        showStep(0);

      }
    );


    /* START */

    updateNeedsView();

    showStep(0);

    renderPartnerOffers();

    renderAllProgramsOverview();

  </script>
